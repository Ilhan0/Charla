name: Charla
options:
  bundleIdPrefix: de.privat
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Charla:
    type: application
    platform: iOS
    sources:
      - path: Charla
      # Die Web-Oberfläche wird als Ordner unverändert ins App-Paket kopiert (Ordner „www“).
      - path: www
        type: folder
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Charla
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Das Mikrofon wird für die Sprechübungen benötigt. / The microphone is used for the speaking exercises.
        NSSpeechRecognitionUsageDescription: Die Spracherkennung prüft deine spanische Aussprache. / Speech recognition checks your Spanish pronunciation.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.privat.charla
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
